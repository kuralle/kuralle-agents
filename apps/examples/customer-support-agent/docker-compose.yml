services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: kuralle_support
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kuralle_support"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - kuralle-support-postgres:/var/lib/postgresql/data

volumes:
  kuralle-support-postgres:
