<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kuralle Agent Builder</title>
    <style>
      :root { color-scheme: light dark; }
      body { font: 15px/1.5 ui-sans-serif, system-ui, sans-serif; margin: 0; }
      main { max-width: 46rem; margin: 0 auto; padding: 2rem 1.25rem 4rem; }
      header { display: flex; justify-content: space-between; align-items: center; gap: 1rem; }
      h1 { font-size: 1.35rem; margin: 0; }
      h2 { font-size: 1rem; margin: 0 0 .5rem; }
      section { border: 1px solid color-mix(in srgb, currentColor 18%, transparent);
                border-radius: .6rem; padding: 1rem; margin: 1rem 0; }
      label { display: block; margin: .5rem 0; }
      input, textarea, select { width: 100%; padding: .45rem .6rem; font: inherit;
                border-radius: .4rem; border: 1px solid color-mix(in srgb, currentColor 25%, transparent);
                background: transparent; color: inherit; box-sizing: border-box; }
      select { width: auto; }
      button { font: inherit; padding: .45rem .9rem; margin: .35rem .35rem .35rem 0;
               border-radius: .4rem; cursor: pointer; }
      button:disabled { opacity: .5; cursor: not-allowed; }
      pre { white-space: pre-wrap; margin: .5rem 0 0; }
      .muted { opacity: .65; }
      .warn { color: #b45309; }
      .ok { color: #047857; }
      footer { opacity: .75; font-size: .9rem; }
      table { width: 100%; border-collapse: collapse; margin: .5rem 0; font-size: .88rem; }
      th, td { text-align: left; padding: .35rem .5rem; vertical-align: top;
               border-bottom: 1px solid color-mix(in srgb, currentColor 12%, transparent); }
      th { font-weight: 600; opacity: .7; }
      tr.sel { background: color-mix(in srgb, currentColor 8%, transparent); }
      code { font-size: .88em; }
      form { display: flex; gap: .5rem; align-items: center; }
      form input { flex: 1; }
      .transcript { border: 1px solid color-mix(in srgb, currentColor 14%, transparent);
                    border-radius: .5rem; padding: .5rem .75rem; margin: .5rem 0;
                    max-height: 22rem; overflow-y: auto; }
      .msg { margin: .4rem 0; }
      .msg strong { display: inline-block; min-width: 5.5rem; opacity: .6;
                    font-size: .78rem; text-transform: uppercase; letter-spacing: .04em; }
      .msg.user { opacity: .85; }
      .detail { border-top: 1px solid color-mix(in srgb, currentColor 18%, transparent);
                margin-top: 1rem; padding-top: .75rem; }
      h3, h4 { font-size: .95rem; margin: .75rem 0 .35rem; }
      details { margin: .35rem 0; }
      summary { cursor: pointer; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/web/main.tsx"></script>
  </body>
</html>
